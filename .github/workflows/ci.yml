# xolu CI — quick tier only (build, vet, unit tests, lint).
# Stress/integration tiers are dormant guards run per Part 3 §8 of the
# working practices; wiring them into CI is a recorded, undecided option
# (see docs/TRACKING.md T-37 note).
#
# Versions are pinned exactly. "latest" is how the previous pipeline
# broke: golangci-lint-action@v4 resolved "latest" to v1.64.8 (the final
# v1, built with Go 1.24), which cannot load v2 configs or analyse
# Go ≥ 1.25 targets. Bump the pins deliberately, together.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # tracks the go directive; no separate pin to drift
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2          # pinned; built with go1.26.x, handles the 1.26.5 target
          args: --timeout=5m
