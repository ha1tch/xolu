# Quick tier: build, vet, unit tests, lint. Versions are pinned deliberately:
# golangci-lint must be built with a Go toolchain >= the go.mod target, so
# bump the go directive, the linter pin below, and the Dockerfile base image
# together.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # tracks the go directive; no separate pin to drift
      - run: go build ./...
      - run: go vet ./...
      - name: c04dcheck (substrate law @C04d, T-45)
        run: |
          cd tools/c04dcheck && go test ./... -count=1 && go build -o /tmp/c04dcheck . && cd ../..
          /tmp/c04dcheck ./...
      - run: go test ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2          # pinned; built with go1.26.x, handles the 1.26.5 target
          args: --timeout=5m

  # TEMPORARY (G-12 RI-strategy probe). Runs the referential-integrity
  # restrict race guard AND the throughput benchmark once per strategy on
  # the multi-core GitHub runner — the only place the write-skew anomaly
  # and the serialisation cost actually manifest. Each matrix cell is an
  # independent correctness verdict plus a benchmark line; the job summary
  # collects them into a succinct per-strategy report. Once the winning
  # strategy is chosen and the redundant strategies removed, delete this
  # job and restore release.yml / cross-build.yml.
  ri-strategy-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # every strategy must report, even if one fails correctness
      matrix:
        ri_strategy: [serialize, intx-only, serialize-intx]
    env:
      XOLU_RI_STRATEGY: ${{ matrix.ri_strategy }}
      XOLU_LOG_LEVEL: error       # silence hardware-calibration info lines in bench output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cores
        run: echo "runner NumCPU=$(nproc)"
      - name: Correctness gate (race guard, -race, multi-core)
        id: correctness
        run: |
          set +e
          go test ./pkg/server/ -run TestRIRestrict_Race -count=20 -race -v \
            > /tmp/correctness.txt 2>&1
          code=$?
          set -e
          tail -n 20 /tmp/correctness.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Do not fail the step here — we still want the benchmark line
          # for a strategy that is correct, and a clear verdict for one
          # that is not. The summary encodes pass/fail.
      - name: Throughput benchmark (RI-relevant workload)
        id: bench
        run: |
          set +e
          go test -tags ristrategybench ./pkg/server/ \
            -run '^$' -bench BenchmarkRIStrategy -benchmem -benchtime=3s \
            > /tmp/bench.txt 2>&1
          bcode=$?
          set -e
          grep -E "BenchmarkRIStrategy|ns/op" /tmp/bench.txt || true
          echo "exit_code=$bcode" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        run: |
          {
            echo "## RI strategy: \`${{ matrix.ri_strategy }}\`"
            echo ""
            if [ "${{ steps.correctness.outputs.exit_code }}" = "0" ]; then
              echo "**Correctness (multi-core -race, 20x): PASS** ✓"
            else
              echo "**Correctness (multi-core -race, 20x): FAIL** ✗"
              echo ""
              echo '```'
              grep -iE "dangling|FAIL" /tmp/correctness.txt | head -5 || true
              echo '```'
            fi
            echo ""
            echo "Throughput (RI-relevant concurrent create-ref + delete-target):"
            echo '```'
            grep -E "BenchmarkRIStrategy|ns/op" /tmp/bench.txt | head -3 || echo "(no benchmark line captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
