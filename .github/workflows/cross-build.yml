# Cross-compilation verification for every target the release pipeline ships.
# All targets build with cgo disabled. The matrix is constrained by
# modernc.org/libc (pure-Go SQLite's platform layer): before adding a target
# or after bumping modernc.org/sqlite, check the supported set in
# modernc.org/libc@<ver>/errno/.

name: cross-build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  cross-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64,   goos: linux,   goarch: amd64 }
          - { name: linux/386,     goos: linux,   goarch: '386' }
          - { name: linux/armv6,   goos: linux,   goarch: arm, goarm: '6' }
          - { name: linux/armv7,   goos: linux,   goarch: arm, goarm: '7' }
          - { name: linux/arm64,   goos: linux,   goarch: arm64 }
          - { name: darwin/amd64,  goos: darwin,  goarch: amd64 }
          - { name: darwin/arm64,  goos: darwin,  goarch: arm64 }
          - { name: windows/amd64, goos: windows, goarch: amd64 }
          - { name: windows/386,   goos: windows, goarch: '386' }
          - { name: windows/arm64, goos: windows, goarch: arm64 }
          - { name: freebsd/amd64, goos: freebsd, goarch: amd64 }
          - { name: freebsd/arm64, goos: freebsd, goarch: arm64 }
          - { name: freebsd/386,   goos: freebsd, goarch: '386' }
          - { name: openbsd/amd64, goos: openbsd, goarch: amd64 }
          - { name: openbsd/arm64, goos: openbsd, goarch: arm64 }
          - { name: netbsd/amd64,  goos: netbsd,  goarch: amd64 }
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build shipped binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath ./cmd/xolu
          go build -trimpath ./cmd/iolu
          go build -trimpath ./cmd/xotogen
